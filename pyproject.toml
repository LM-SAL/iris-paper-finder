[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
name = "paper-data-linking"
version = "0.1.0"
description = "Identify and extract data references in heliophysics research papers."
license = "MIT"
authors = [
    {name = "Anthony Buonomo", email = "anthony.r.buonomo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
]
dependencies = [
    "numpy",
    "onnxruntime",
    "openai",
    "PyMuPDF",
    "python-dotenv",
    "pydantic",
    "requests",
    "tiktoken",
    "tokenizers",
]

[project.scripts]
iris-papers = "paper_data_linking.cli:main"

[project.optional-dependencies]
browser = [
    "selenium",
]
ocr = [
    "pdf2image",
    "pytesseract",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["paper_data_linking*"]

[tool.setuptools.package-dir]
"" = "src"
