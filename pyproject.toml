[tool.poetry]
name = "paper-data-linking"
version = "0.1.0"
description = "Identify and extract data references in heliophysics research papers. Starting with papers which use SOHO instrument data."
authors = ["Anthony Buonomo <anthony.r.buonomo@gmail.com>"]
readme = "README.md"
packages = [{include = "paper_data_linking"}]

[tool.poetry.dependencies]
python = "^3.10,<3.11"
numpy = "^1.24.2"
python-dotenv = "^0.21.1"
tqdm = "^4.64.1"
pytest = "^7.2.2"
langchain = "^0.0.335"
pymupdf = "^1.21.1"
pytesseract = "^0.3.10"
pdf2image = "^1.16.3"
tiktoken = "^0.3.3"
chromadb = "^0.4.17"
openai = "^1.2.3"
fastapi = "^0.104.1"
uvicorn = "^0.21.1"
python-multipart = "^0.0.6"
aiofiles = "^23.1.0"
websockets = "^11.0.2"
fuzzywuzzy = "^0.18.0"
python-levenshtein = "^0.21.0"
thefuzz = "^0.19.0"
spacy = "^3.5.1"
celery = "^5.3.1"
redis = "^4.6.0"
unstructured = {extras = ["local-inference"], version = "^0.6.2"}
slowapi = "^0.1.8"
webdriver-manager = "4.0.1"
aiohttp = "^3.8.6"
dspy-ai = "^2.0.4"
pydantic = "1.10.10"
ipdb = "^0.13.13"
en-core-web-sm = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1.tar.gz"}

[tool.poetry.group.scraper]
optional = true

[tool.poetry.group.scraper.dependencies]
selenium = "^4.8.2"
ads = "^0.12.3"
lxml = "^4.9.2"
zeep = "^4.2.1"
webdriver-manager = "^4.0.1"
requests = "^2.28.2"

[tool.poetry.group.llm]
optional = true

[tool.poetry.group.llm.dependencies]
sunpy = {extras = ["all"], version = "^4.1.3"}
transformers = "^4.26.1"
sentence-transformers = "^2.2.2"
instructorembedding = "^1.0.0"
jupyter = "^1.0.0"
seaborn = "^0.12.2"
pandas = "^1.5.3"
drms = "^0.6.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
