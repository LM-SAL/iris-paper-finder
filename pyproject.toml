[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
name = "iris-paper-llm"
version = "0.2.0"
description = "Decide which papers belong in the ADS IRIS bibliography."
license = "MIT"
authors = [
    {name = "Anthony Buonomo", email = "anthony.r.buonomo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai",
    "PyMuPDF",
    "python-dotenv",
    "pydantic",
    "requests",
]

[project.scripts]
iris-papers = "iris_paper_llm.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.codespell]
skip = "*.pdf,uv.lock"
ignore-words-list = "ure"  # the FIG(?:URE|.) caption regex in classify.py

[[tool.ty.overrides]]
include = ["tests/**"]
rules = {invalid-argument-type = "ignore"}  # the tests pass duck-typed fakes for the OpenAI client and requests session
