# Monthly check that the ADS (SciX) search and library APIs still work, and the OpenAI API too when its secret is set
# (two classifications, about a cent).
name: Live check

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_KEY_SET: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - run: uv run iris-papers search --year "$(( $(date -u +%Y) - 1 ))" --limit 2 --output live/metadata.jsonl
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
      # classify and run compare their results with the ADS IRIS library (756 papers in January 2026).
      - run: >-
          uv run python -c 'from pathlib import Path; from iris_paper_llm.ads import fetch_library;
          assert fetch_library(Path("live/library.txt")) > 500, "the ADS IRIS library looks too small"'
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
      # The first two reviewed cases are tracked PDFs in tests/data/pdfs, so nothing is downloaded.
      - run: uv run iris-papers evaluate --limit 2 --output live/eval.jsonl
        if: env.OPENAI_KEY_SET == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - shell: python
        run: |
          from pathlib import Path

          assert len(Path("live/metadata.jsonl").read_text().splitlines()) == 2, "ADS returned fewer than 2 papers"
      - shell: python
        if: env.OPENAI_KEY_SET == 'true'
        run: |
          import json
          from pathlib import Path

          records = [json.loads(line) for line in Path("live/eval.jsonl").read_text().splitlines()]
          wrong = [
              record["id"]
              for record in records
              if record["result"]["status"] != "CLASSIFIED"
              or record["result"]["classification"]["include"] != record["expected"]["include"]
          ]
          assert len(records) == 2 and not wrong, f"failed or wrong: {wrong}"
