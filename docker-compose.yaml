services:
  built_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: built_app:latest

  redis:
    image: redis:7.0.11
    ports:
      - "6379:6379"
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 10s
      retries: 5

  celery:
    image: built_app:latest
    command: celery -A paper_data_linking.web_app.celery_app:app worker -E -B
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: built_app:latest
    command: celery --broker=redis://redis:6379/0 flower
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_started

  web:
    image: built_app:latest
    ports:
      - "8000:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    depends_on:
      - celery

  nginx:
    build: nginx
    ports:
      - "80:80"
    depends_on:
      - web
