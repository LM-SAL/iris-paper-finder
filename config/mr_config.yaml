name: "Magnetic Reconnection"
classifier:
  name: "RECONNECTION"
  query: "Does this paper discuss the phenomenon of magnetic reconnection?"
  system_message: "You are a helpful assistant who helps analyze scientific documents and you produce Markdown outputs."
  human_message: |
    Based on the excerpts provided, please answer the following questions:

    A. Does this paper directly discuss magnetic reconnection as a phenomenon?  
    B. Does this paper mention observations, experiments, or simulations related to magnetic reconnection?  
    C. Does this paper discuss impacts or consequences of magnetic reconnection in space or laboratory plasma?

    For each question, provide causal (not associative) reasoning with references to the provided excerpts. If the answer to ANY of these questions is yes, the paper is considered a RECONNECTION paper. If the excerpts seem to be from a review of others' reconnection-related work, the determination is UNCERTAIN. Finally, conclude whether the overall paper can be classified as a RECONNECTION paper, and end with:

    ```
    Classification: <YES, NO, or UNCERTAIN>
    Reconnection Aspects Discussed: ["EXAMPLE_ASPECT1", "EXAMPLE_ASPECT2", ...]
    ```

  answer_divider: "Classification:"
  answer_key: "RECONNECTION"
  json_divider: "Reconnection Aspects Discussed:"
  json_key: "aspects"
  label_metadata_map:

  filter_threshold: 80
  filter_terms:
      - "magnetic reconnection"
      - "reconnection"
      - "magnetic merging"
      - "flux transfer events"
      - "current sheet"
      - "magnetopause reconnection"
      - "magnetotail"
      - "diffusion region"
      - "magnetic island"
      - "magnetic null"
      - "magnetic separator"
      - "magnetic topology"
      - "Hall reconnection"
      - "tearing mode"
      - "X-point"
      - "O-point"
      - "magnetic shear"
      - "plasmoid"
      - "reconnection jet"
      - "reconnection rate"
      - "Petschek reconnection"
      - "Sweet-Parker reconnection"
      - "guide field reconnection"
      - "anti-parallel reconnection"
      - "component reconnection"
      - "reconnection outflow"

model_kwargs:
  model_name: "gpt-4"
  temperature: 0

embedder_kwargs:
  where:
    passed_soho_heuristic: 1