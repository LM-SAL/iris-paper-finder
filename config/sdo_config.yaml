name: "Solar Dynamics Observatory"
classifier:
  name: "SDO"
  query: "Does this paper use data from the Solar Dynamics Observatory or its instruments (AIA, HMI, EVE)?"
  system_message: "You are a helpful assistant who helps analyze scientific documents and you produce Markdown outputs."
  human_message: |
    Based on the excerpts provided, please answer the following questions:

    A. Does this paper directly use data from the Solar Dynamics Observatory mission and its primary catalogues?
    B. Does this paper make quantitative predictions of results from the Solar Dynamics Observatory mission?
    C. Does this paper describe the Solar Dynamics Observatory mission, its instruments, operations, software, or calibrations?

    For your reference, here is a list of Solar Dynamics Observatory instruments: AIA, HMI, EVE.

    For each question, provide causal (not associative) reasoning with references to the provided excerpts (being sure to mention any SDO instruments used). If the answer to ANY of these questions is yes, the paper is considered an SDO paper. If the excerpts seem to be from a review of others' SDO-related work, the determination is UNCERTAIN. Finally, conclude whether the overall paper can be classified as an SDO paper, and end with:

    ```
    Classification: <YES, NO, or UNCERTAIN>
    SDO Instruments Used: ["EXAMPLE_INSTRUMENT1", "EXAMPLE_INSTRUMENT2", ...]
    ```
  answer_divider: "Classification:"
  json_divider: "SDO Instruments Used:"
  answer_key: "SDO"
  json_key: "instruments"
  label_metadata_map:
    AIA:
      detail: "Atmospheric Imaging Assembly"
      link: "https://doi.example/AIA"
    HMI:
      detail: "Helioseismic and Magnetic Imager"
      link: "https://doi.example/HMI"
    EVE:
      detail: "Extreme Ultraviolet Variability Experiment"
      link: "https://doi.example/EVE"

  filter_threshold: 80
  filter_terms:
    - "SDO"
    - "Solar Dynamics Observatory"
    - "AIA"
    - "Atmospheric Imaging Assembly"
    - "HMI"
    - "Helioseismic and Magnetic Imager"
    - "EVE"
    - "Extreme Ultraviolet Variability Experiment"
    - "Coronal Loops"
    - "Magnetic Fields"
    - "Solar Flares"
    - "Solar Corona"
    - "Active Region"
    - "EUV Imaging"

model_kwargs:
  model_name: "gpt-4"
  temperature: 0

embedder_kwargs:
  where:
    passed_sdo_heuristic: 1
