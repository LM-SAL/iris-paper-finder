name: "Solar Corona"
classifier:
  name: "CORONA"
  query: "Does this paper discuss the solar corona or phenomena related to it?"
  system_message: "You are a helpful assistant who helps analyze scientific documents and you produce Markdown outputs."
  human_message: |
    Based on the excerpts provided, please answer the following questions:

    A. Does this paper directly discuss the solar corona and its features?
    B. Does this paper mention observational techniques or data related to the solar corona?  
    C. Does this paper describe solar activities or events originating in the corona?

    For each question, provide causal (not associative) reasoning with references to the provided excerpts. If the answer to ANY of these questions is yes, the paper is considered a CORONA paper. If the excerpts seem to be from a review of others' corona-related work, the determination is UNCERTAIN. Finally, conclude whether the overall paper can be classified as a CORONA paper, and end with:

    ```
    Classification: <YES, NO, or UNCERTAIN>
    Corona Features Discussed: ["EXAMPLE_FEATURE1", "EXAMPLE_FEATURE2", ...]
    ```

  answer_divider: "Classification:"
  answer_key: "CORONA"
  json_divider: "Corona Features Discussed:"
  json_key: "features"
  label_metadata_map:

  filter_threshold: 80
  filter_terms:
      - "corona"
      - "coronal"
      - "solar corona"
      - "coronal mass ejection"
      - "coronal loops"
      - "coronal hole"
      - "coronal heating"
      - "coronal streamer"
      - "coronal rain"
      - "solar prominence"
      - "coronal seismology"
      - "magnetic field lines"
      - "coronal temperature"
      - "heliosphere"
      - "solar wind"
      - "solar eruption"
      - "flare loops"
      - "coronal bright point"
      - "magnetohydrodynamics"
      - "coronal plasma"
      - "solar magnetic activity"
      - "coronal oscillations"
      - "solar cycle"
      - "Alfvén waves"
      - "solar telescopes"
      - "solar radio bursts"
      - "solar spectroscopy"
      - "eclipse observations"
      - "coronal diagnostics"

model_kwargs:
  model_name: "gpt-4"
  temperature: 0

embedder_kwargs:
  where:
    passed_soho_heuristic: 1